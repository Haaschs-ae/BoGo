name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  macos:
    needs: test
    runs-on: macos-latest
    env:
      # Fichiers de mise à jour signés (BoGo.app.tar.gz + .sig), si la clé est en secret.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: scripts/build-vision.sh
      # Même signature à chaque version : macOS garde l'autorisation d'enregistrer l'écran.
      - run: scripts/macos-keychain.sh
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      # Universelle : marche sur les Mac Apple Silicon et Intel.
      - run: |
          extra=()
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          npx tauri build --target universal-apple-darwin "${extra[@]}"
      - name: Signature de l'appli
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/BoGo.app
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Authority|Signature" || true
          codesign -d -r- "$app" 2>&1 | tail -1
          codesign --verify --deep "$app" && echo "Signature valide"
      - uses: actions/upload-artifact@v4
        with:
          name: BoGo-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        with:
          name: update-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/BoGo.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/BoGo.app.tar.gz.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Édition Windows expérimentale (suivi manuel, sans lecture de l'écran pour l'instant) :
  # son échec ne bloque pas la version Mac.
  windows:
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - shell: bash
        run: |
          extra=()
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          npx tauri build "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: BoGo-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        with:
          name: update-windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  # Publication : une version dont le numéro n'est pas encore publié devient la nouvelle
  # version de BoGo (page Releases + latest.json). Les BoGo installés se la proposent.
  publish:
    needs: [macos, windows]
    if: >-
      always() && needs.macos.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/v1-etape1')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Version à publier ?
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "Clé de signature des mises à jour absente : rien n'est publié."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" > /dev/null 2>&1; then
            echo "BoGo $version est déjà publié."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          pattern: update-*
          path: files
          merge-multiple: true
      - name: Publier BoGo ${{ steps.version.outputs.version }}
        if: steps.version.outputs.publish == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          # Nouveautés de cette version : la section « ## X.Y.Z » de docs/nouveautes.md.
          awk -v v="$version" '$0 ~ "^## " {on = ($2 == v); next} on' docs/nouveautes.md > notes.md
          # Les fichiers arrivent rangés par dossier (macos/, dmg/) : tous à plat.
          find files -mindepth 2 -type f -exec mv {} files/ \;
          ls -la files
          node scripts/latest-json.mjs "$version" files notes.md > files/latest.json
          cat files/latest.json
          gh release create "v$version" --target "$GITHUB_SHA" --title "BoGo $version" --notes-file notes.md \
            files/latest.json files/BoGo.app.tar.gz files/BoGo.app.tar.gz.sig files/*.dmg \
            $(ls files/*-setup.exe files/*-setup.exe.sig 2>/dev/null)
