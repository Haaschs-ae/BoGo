[package]
name = "bogo"
version = "0.2.3"
description = "Overlay de build orders pour Age of Empires IV"
edition = "2021"

[lib]
name = "bogo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Transforme l'overlay en NSPanel, seul type de fenêtre affiché par-dessus une appli en plein écran.
tauri-nspanel = "2.1"
