[package]
name = "bogo-vision"
version = "0.1.0"
description = "Lecture de l'écran d'AoE4 pour BoGo, édition Windows"
edition = "2021"
publish = false

# Programme à part (comme bogo-vision en Swift sur Mac), lancé par BoGo.
[workspace]

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"
windows-collections = "0.3"

[profile.release]
opt-level = 3
strip = true
